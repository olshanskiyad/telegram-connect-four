# Пример reverse proxy для запуска игры на своём домене с HTTPS (Telegram открывает Mini App только по HTTPS).
# Замените example.com на свой домен и пути к сертификату (здесь пути Let's Encrypt по умолчанию).
# Приложение слушает 127.0.0.1:3000, WebSocket-сервер 127.0.0.1:3002 (так их открывает docker-compose.yml).
# В .env оставьте WS_PUBLIC_URL пустым: браузер подключится к wss://example.com/ws.

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Обновления комнат по WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Веб-приложение и API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
